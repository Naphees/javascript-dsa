<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Demo</title>
</head>
<body>
    <h1>What can JavaScript Do?</h1>
    <p id="demo">Javascript can change html content</p>
    <button type="button" onclick="document.getElementById('demo').innerHTML='Hello javascript!'">
        Click Me!
    </button>

    <!--
      javascript can html attribute
    -->
      <img src="pic_bulbon.gif" width="300" height="300"  id="myImage" />
      <button type="button" onclick="document.getElementById('myImage').src='pic_bulbon.gif' ">Turn On Bulb</button>
      <button type="button" onclick="document.getElementById('myImage').src='pic_bulboff.gif' ">Turn Off Bulb</button>
        <p id="demo1"> Demo1 paragraph  </p>
        <button type="button" onclick="myFunction()">demo1 </button>
      <script>
         function myFunction(){
            document.getElementById('demo1').innerHTML="Paragraph changed.";
         }
      </script>
</body>
</html>
